<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pravax Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #f0f2f5; min-height: 100vh; padding: 16px; }

  .title { text-align: center; font-size: 26px; font-weight: 800; margin: 16px 0 22px;
    background: linear-gradient(90deg, #2aabeb, #60cce4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .gate { max-width: 380px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .gate input { width: 100%; padding: 12px 14px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 15px; margin-bottom: 12px; outline: none; }
  .gate button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2aabeb; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .gate-error { color: #e02424; font-size: 13px; margin-top: 8px; text-align: center; }

  #dashboard { display: none; max-width: 960px; margin: 0 auto; }

  .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #fff; padding: 6px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab-btn { flex-shrink: 0; padding: 10px 14px; border: none; background: transparent; border-radius: 8px; font-weight: 700; font-size: 13px; color: #64748b; cursor: pointer; white-space: nowrap; }
  .tab-btn.active { background: #2aabeb; color: #fff; }
  .tab-content { display: none; } .tab-content.active { display: block; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .toolbar .count { color: #5f6368; font-size: 14px; }
  .refresh-btn { padding: 10px 16px; border: none; border-radius: 8px; background: #2aabeb; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: #fff; border-radius: 12px; padding: 16px 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .stat-card .num { font-size: 22px; font-weight: 800; color: #2aabeb; }
  .stat-card .label { font-size: 11px; color: #64748b; margin-top: 4px; text-transform: uppercase; }
  @media (max-width: 640px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

  .search-box { width: 100%; padding: 12px 14px; border: 1px solid #ccd0d5; border-radius: 10px; font-size: 15px; margin-bottom: 16px; outline: none; }

  .source-chip { flex: 1; padding: 9px 6px; border: 1.5px solid #dbe3ee; background: #fff; border-radius: 9px; font-weight: 700; font-size: 12.5px; color: #64748b; cursor: pointer; }
  .source-chip.active { background: #2aabeb; color: #fff; border-color: #2aabeb; }

  .user-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); padding: 16px; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; }
  .user-card img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #f0f2f5; flex-shrink: 0; }
  .user-info { flex-grow: 1; min-width: 0; }
  .user-info .name { font-weight: 700; font-size: 15px; color: #1e293b; }
  .user-info .detail { font-size: 12.5px; color: #64748b; margin-top: 2px; word-break: break-word; }
  .source-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: 6px; }
  .src-devonix { background: #e0f2fe; color: #0369a1; }
  .src-email { background: #f1f5f9; color: #475569; }
  .banned-tag { display: inline-block; background: #fee2e2; color: #dc2626; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: 6px; }
  .card-buttons { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .open-btn, .delete-btn, .ban-btn, .unban-btn { border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .open-btn { background: #e0f2fe; color: #0369a1; }
  .delete-btn { background: #fee2e2; color: #dc2626; }
  .ban-btn { background: #fff7ed; color: #c2410c; }
  .unban-btn { background: #dcfce7; color: #16a34a; }

  .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 18px 0 6px; }
  .page-btn { padding: 9px 16px; border: 1px solid #dbe3ee; background: #fff; border-radius: 8px; font-weight: 700; font-size: 13px; color: #2aabeb; cursor: pointer; }
  .page-btn:disabled { color: #cbd5e1; cursor: not-allowed; }
  .page-info { font-size: 13px; color: #64748b; font-weight: 600; }

  .empty-state { text-align: center; color: #64748b; padding: 40px 0; }

  /* Analytics */
  .analytics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
  @media (max-width: 640px) { .analytics-grid { grid-template-columns: repeat(2, 1fr); } }
  .analytics-card { background: #fff; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .analytics-card .num { font-size: 22px; font-weight: 800; color: #2aabeb; }
  .analytics-card .label { font-size: 11px; color: #64748b; margin-top: 4px; }
  .section-title { font-size: 13px; font-weight: 800; color: #2aabeb; margin: 20px 0 8px; }
  .bar-row { display: flex; align-items: flex-end; gap: 3px; height: 120px; background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 10px; overflow-x: auto; }
  .bar { flex: 1; min-width: 6px; background: #2aabeb; border-radius: 3px 3px 0 0; min-height: 3px; }
  .bar.down { background: #f87171; }
  .bar-label { font-size: 8px; color: #94a3b8; text-align: center; margin-top: 4px; }
  .cat-list { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .cat-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
  .cat-row:last-child { border-bottom: none; }
  .cat-name { flex: 1; font-size: 13px; font-weight: 600; color: #1e293b; }
  .cat-bar-bg { flex: 2; height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
  .cat-bar-fill { height: 100%; background: #2aabeb; }
  .cat-count { font-size: 12px; font-weight: 700; color: #64748b; width: 34px; text-align: right; }

  /* User detail modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px 12px; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 520px; margin-top: 24px; }
  .modal-box h3 { font-size: 17px; margin-bottom: 4px; color: #1c1e21; display: flex; justify-content: space-between; }
  .modal-close { cursor: pointer; font-size: 20px; color: #64748b; background: none; border: none; }
  .modal-sub { font-size: 12px; color: #64748b; margin-bottom: 14px; }
  .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .mini-stat { background: #f8fafc; border-radius: 10px; padding: 10px; text-align: center; }
  .mini-stat .n { font-size: 16px; font-weight: 800; color: #2aabeb; }
  .mini-stat .l { font-size: 10px; color: #64748b; margin-top: 2px; }
  .modal-action-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .modal-action-row button { flex: 1; border: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
  .msg-item { padding: 10px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; }
  .msg-item.user { background: #eef2ff; }
  .msg-item.ai { background: #f8fafc; }
  .msg-meta { font-size: 10px; color: #94a3b8; margin-top: 6px; }

  /* নতুন ট্যাবগুলোর জন্য */
  .audit-row { padding: 12px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
  .audit-row:last-child { border-bottom: none; }
  .audit-action { font-weight: 700; color: #1e293b; }
  .audit-action.ban_user { color: #c2410c; }
  .audit-action.unban_user { color: #16a34a; }
  .audit-action.delete_user { color: #dc2626; }
  .audit-meta { font-size: 11px; color: #94a3b8; margin-top: 3px; }
  .satisfaction-badge { display: inline-block; font-size: 26px; font-weight: 800; }
  .big-card { background: #fff; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 16px; }
  .big-card .num { font-size: 34px; font-weight: 800; color: #2aabeb; }
  .big-card .label { font-size: 13px; color: #64748b; margin-top: 4px; }
  .quick-link-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .quick-link { flex: 1; min-width: 100px; padding: 10px; background: #f8fafc; border-radius: 10px; text-align: center; font-size: 12px; font-weight: 700; color: #2aabeb; cursor: pointer; }
</style>
</head>
<body>

<div class="title"><i>Pravax Admin</i></div>

<div class="gate" id="gate">
  <input type="password" id="adminPassword" placeholder="Admin Password">
  <button onclick="unlock()">Login</button>
  <div class="gate-error" id="gateError"></div>
</div>

<div id="dashboard">
  <div class="admin-tabs">
    <button class="tab-btn active" id="tabBtnUsers" onclick="switchTab('users')">👥 Users</button>
    <button class="tab-btn" id="tabBtnBanned" onclick="switchTab('banned')">🚫 Banned</button>
    <button class="tab-btn" id="tabBtnOverview" onclick="switchTab('overview')">🏠 Overview</button>
    <button class="tab-btn" id="tabBtnGrowth" onclick="switchTab('growth')">📈 Growth</button>
    <button class="tab-btn" id="tabBtnTokens" onclick="switchTab('tokens')">🔢 Tokens</button>
    <button class="tab-btn" id="tabBtnFeedback" onclick="switchTab('feedback')">👍 Feedback</button>
    <button class="tab-btn" id="tabBtnCategories" onclick="switchTab('categories')">🏷️ Categories</button>
    <button class="tab-btn" id="tabBtnAudit" onclick="switchTab('audit')">📜 Audit</button>
    <button class="tab-btn" id="tabBtnKnowledge" onclick="switchTab('knowledge')">📚 Knowledge</button>
  </div>

  <!-- ================= ইউজার ট্যাব ================= -->
  <div class="tab-content active" id="tabUsers">
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search by name or email" oninput="onSearchInput()">
    <div class="source-filter-row" id="sourceFilterRow" style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="source-chip active" id="srcChipAll" onclick="filterBySource('all')">All</button>
      <button class="source-chip" id="srcChipDevonix" onclick="filterBySource('devonix')">🔵 Dev-Onix</button>
      <button class="source-chip" id="srcChipEmail" onclick="filterBySource('email')">✉️ Email</button>
    </div>
    <div class="toolbar">
      <span class="count" id="userCount">Loading...</span>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="refresh-btn" onclick="loadUsers(1)">Refresh</button>
        <button class="refresh-btn" style="background:#e0f2fe;color:#0369a1;" onclick="exportCsv()">⬇️ CSV</button>
        <button class="refresh-btn" style="background:#e4e6eb;color:#1c1e21;" onclick="adminLogout()">Logout</button>
      </div>
    </div>
    <div id="userList"></div>
    <div class="pagination" id="userPagination"></div>
  </div>

  <!-- ================= ব্যান করা ইউজার ট্যাব ================= -->
  <div class="tab-content" id="tabBanned">
    <div class="toolbar">
      <span class="count" id="bannedCount">Loading...</span>
      <button class="refresh-btn" onclick="loadBanned(1)">Refresh</button>
    </div>
    <div id="bannedList"></div>
    <div class="pagination" id="bannedPagination"></div>
  </div>

  <!-- ================= Overview ট্যাব ================= -->
  <div class="tab-content" id="tabOverview">
    <div id="overviewContent"><div class="empty-state">Loading...</div></div>
  </div>

  <!-- ================= Growth ট্যাব ================= -->
  <div class="tab-content" id="tabGrowth">
    <div id="growthContent"><div class="empty-state">Loading...</div></div>
  </div>

  <!-- ================= Tokens ট্যাব ================= -->
  <div class="tab-content" id="tabTokens">
    <div id="tokensContent"><div class="empty-state">Loading...</div></div>
  </div>

  <!-- ================= Feedback ট্যাব ================= -->
  <div class="tab-content" id="tabFeedback">
    <div id="feedbackContent"><div class="empty-state">Loading...</div></div>
  </div>

  <!-- ================= Categories ট্যাব ================= -->
  <div class="tab-content" id="tabCategories">
    <div id="categoriesContent"><div class="empty-state">Loading...</div></div>
  </div>

  <!-- ================= Audit Log ট্যাব ================= -->
  <div class="tab-content" id="tabAudit">
    <div class="toolbar">
      <span class="count" id="auditCount">Loading...</span>
      <button class="refresh-btn" onclick="loadAudit(1)">Refresh</button>
    </div>
    <div class="cat-list" id="auditList"></div>
    <div class="pagination" id="auditPagination"></div>
  </div>

  <!-- ================= Knowledge (RAG) ট্যাব ================= -->
  <div class="tab-content" id="tabKnowledge">
    <div class="section-title">এখন পর্যন্ত যোগ করা জ্ঞানভাণ্ডার</div>
    <div id="knowledgeSummary"><div class="empty-state">Loading...</div></div>

    <div class="section-title" style="margin-top:20px;">নতুন টেক্সট যোগ করুন</div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <input type="text" id="kTradition" placeholder="tradition (যেমন: sanatan, islamic, psychology)" style="flex:1; padding:10px; border:1px solid #dbe3ee; border-radius:8px; font-size:13px;">
    </div>
    <input type="text" id="kSourceRef" placeholder="source reference (যেমন: Garuda Purana Ch. 5) — ঐচ্ছিক" style="width:100%; padding:10px; border:1px solid #dbe3ee; border-radius:8px; font-size:13px; margin-bottom:10px;">
    <textarea id="kText" placeholder="এখানে টেক্সট পেস্ট করুন (একবারে সর্বোচ্চ ~২ লক্ষ ক্যারেক্টার)" style="width:100%; min-height:180px; padding:10px; border:1px solid #dbe3ee; border-radius:8px; font-size:13px; font-family:inherit; margin-bottom:10px;"></textarea>
    <button class="refresh-btn" style="width:100%; padding:12px;" onclick="ingestKnowledge()" id="ingestBtn">⬆️ Chunk করে Embed করে সেভ করুন</button>
    <div id="ingestResult" style="margin-top:10px; font-size:13px;"></div>
  </div>
</div>

<!-- ================= ইউজার ডিটেইল মোডাল ================= -->
<div class="modal-overlay" id="userDetailModal">
  <div class="modal-box">
    <h3 id="modalUserName">- <button class="modal-close" onclick="closeUserDetail()">✕</button></h3>
    <div class="modal-sub" id="modalUserEmail"></div>

    <div class="mini-stats">
      <div class="mini-stat"><div class="n" id="mTokens">0</div><div class="l">Total Tokens</div></div>
      <div class="mini-stat"><div class="n" id="mUp">0</div><div class="l">👍 Up</div></div>
      <div class="mini-stat"><div class="n" id="mDown">0</div><div class="l">👎 Down</div></div>
    </div>

    <div class="section-title" style="margin-top:0;">Top Categories</div>
    <div class="cat-list" id="modalCategories" style="margin-bottom:16px;"></div>

    <div class="modal-action-row">
      <button class="ban-btn" id="modalBanBtn" onclick="modalBanUser()">🚫 Ban</button>
      <button class="unban-btn" id="modalUnbanBtn" onclick="modalUnbanUser()" style="display:none;">✅ Unban</button>
      <button class="delete-btn" onclick="modalDeleteUser()">🗑️ Delete</button>
    </div>
  </div>
</div>

<script>
  const PAGE_SIZE = 20;
  let usersPage = 1, usersTotalPages = 1;
  let currentSearch = '';
  let currentSourceFilter = 'all';
  let bannedPage = 1, bannedTotalPages = 1;
  let auditPage = 1, auditTotalPages = 1;
  let searchDebounceTimer = null;
  let currentDetailUserId = null;

  async function unlock() {
    const pw = document.getElementById('adminPassword').value.trim();
    if (!pw) return;
    const gateError = document.getElementById('gateError');
    gateError.innerText = '';
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      if (!res.ok) { gateError.innerText = 'Incorrect password'; return; }
      document.getElementById('adminPassword').value = '';
      showDashboard();
    } catch (e) { gateError.innerText = 'Network error'; }
  }

  function showDashboard() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadUsers(1);
  }

  async function adminLogout() {
    try { await fetch('/api/admin/login', { method: 'DELETE' }); } catch(e) {}
    location.reload();
  }

  (async function checkExistingAdminSession() {
    try {
      const res = await fetch('/api/admin/users?limit=1');
      if (res.ok) showDashboard();
    } catch (e) {}
  })();

  document.getElementById('adminPassword').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    document.getElementById('tabBtn' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    if (tab === 'banned') loadBanned(1);
    if (tab === 'overview') loadOverview();
    if (tab === 'growth') loadGrowth();
    if (tab === 'tokens') loadTokens();
    if (tab === 'feedback') loadFeedback();
    if (tab === 'categories') loadCategories();
    if (tab === 'audit') loadAudit(1);
    if (tab === 'knowledge') loadKnowledgeSummary();
  }

  function onSearchInput() {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
      currentSearch = document.getElementById('searchBox').value.trim();
      loadUsers(1);
    }, 400);
  }

  function filterBySource(source) {
    currentSourceFilter = source;
    document.getElementById('srcChipAll').classList.toggle('active', source === 'all');
    document.getElementById('srcChipDevonix').classList.toggle('active', source === 'devonix');
    document.getElementById('srcChipEmail').classList.toggle('active', source === 'email');
    loadUsers(1);
  }

  // Analytics ট্যাবের "Dev-Onix দিয়ে লগইন" / "Email দিয়ে লগইন" কার্ডে ক্লিক করলে
  // সরাসরি Users ট্যাবে গিয়ে সেই সোর্স দিয়ে ফিল্টার হয়ে যায়
  function goToUsersFilteredBySource(source) {
    switchTab('users');
    filterBySource(source);
  }

  function buildPagination(containerId, page, totalPages, fnName) {
    const c = document.getElementById(containerId);
    if (totalPages <= 1) { c.innerHTML = ''; return; }
    c.innerHTML = `
      <button class="page-btn" ${page <= 1 ? 'disabled' : ''} onclick="${fnName}(${page - 1})">‹ Prev</button>
      <span class="page-info">Page ${page} / ${totalPages}</span>
      <button class="page-btn" ${page >= totalPages ? 'disabled' : ''} onclick="${fnName}(${page + 1})">Next ›</button>
    `;
  }

  async function loadUsers(page) {
    usersPage = page || usersPage;
    document.getElementById('userCount').innerText = 'Loading...';
    try {
      const params = new URLSearchParams({ page: usersPage, limit: PAGE_SIZE, search: currentSearch, source: currentSourceFilter, banned: 'any' });
      const res = await fetch('/api/admin/users?' + params.toString());
      if (res.status === 401) {
        document.getElementById('gate').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        return;
      }
      const data = await res.json();
      if (!res.ok || !Array.isArray(data.users)) { document.getElementById('userCount').innerText = 'Error: ' + (data.error || res.status); return; }

      usersTotalPages = data.totalPages;
      renderUsers(data.users, data.total);
      buildPagination('userPagination', usersPage, usersTotalPages, 'loadUsers');
    } catch (e) { document.getElementById('userCount').innerText = 'Network error'; }
  }

  function renderUsers(users, total) {
    const list = document.getElementById('userList');
    document.getElementById('userCount').innerText = `Total found: ${total} (this page: ${users.length})`;
    if (users.length === 0) { list.innerHTML = `<div class="empty-state">No users found</div>`; return; }

    list.innerHTML = users.map(u => `
      <div class="user-card">
        <img src="${u.profile_picture || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">
        <div class="user-info">
          <div class="name">${(u.first_name || '') + ' ' + (u.last_name || '') || 'No Name'}
            <span class="source-tag ${u.login_source === 'devonix' ? 'src-devonix' : 'src-email'}">${u.login_source === 'devonix' ? 'Dev-Onix' : 'Email'}</span>
            ${u.banned ? '<span class="banned-tag">BANNED</span>' : ''}
          </div>
          <div class="detail">✉️ ${u.email || 'N/A'}</div>
          <div class="detail">💬 ${u.session_count} sessions &nbsp; 🔢 ${u.total_tokens} tokens</div>
        </div>
        <div class="card-buttons">
          <button class="open-btn" onclick="openUserDetail(${u.id})">Open</button>
          <button class="delete-btn" onclick="deleteUser(${u.id})">Delete</button>

  // ================= Banned Users ট্যাব =================
  async function loadBanned(page) {
    bannedPage = page || bannedPage;
    document.getElementById('bannedCount').innerText = 'Loading...';
    try {
      const params = new URLSearchParams({ page: bannedPage, limit: PAGE_SIZE, search: '', source: 'all', banned: 'true' });
      const res = await fetch('/api/admin/users?' + params.toString());
      const data = await res.json();
      if (!res.ok || !Array.isArray(data.users)) { document.getElementById('bannedCount').innerText = 'Error: ' + (data.error || res.status); return; }

      bannedTotalPages = data.totalPages;
      renderBanned(data.users, data.total);
      buildPagination('bannedPagination', bannedPage, bannedTotalPages, 'loadBanned');
    } catch (e) { document.getElementById('bannedCount').innerText = 'Network error'; }
  }

  function renderBanned(users, total) {
    const list = document.getElementById('bannedList');
    document.getElementById('bannedCount').innerText = `মোট ব্যান করা: ${total}`;
    if (users.length === 0) { list.innerHTML = `<div class="empty-state">কোনো ব্যান করা ইউজার নেই 🎉</div>`; return; }

    list.innerHTML = users.map(u => `
      <div class="user-card">
        <img src="${u.profile_picture || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">
        <div class="user-info">
          <div class="name">${(u.first_name || '') + ' ' + (u.last_name || '') || 'No Name'}
            <span class="source-tag ${u.login_source === 'devonix' ? 'src-devonix' : 'src-email'}">${u.login_source === 'devonix' ? 'Dev-Onix' : 'Email'}</span>
            <span class="banned-tag">BANNED</span>
          </div>
          <div class="detail">✉️ ${u.email || 'N/A'}</div>
          ${u.ban_reason ? `<div class="detail" style="color:#c2410c;">📝 কারণ: ${u.ban_reason}</div>` : ''}
          ${u.banned_at ? `<div class="detail" style="color:#94a3b8;">🕒 ${new Date(u.banned_at).toLocaleString()}</div>` : ''}
        </div>
        <div class="card-buttons">
          <button class="open-btn" onclick="openUserDetail(${u.id})">Open</button>
          <button class="delete-btn" onclick="deleteUserFromBanned(${u.id})">Delete</button>
          <button class="unban-btn" onclick="unbanUserFromBanned(${u.id})">Unban</button>
        </div>
      </div>
    `).join('');

  async function deleteUserFromBanned(id) {
    if (!confirm('Deleting this user will also delete all their data. Are you sure?')) return;
    try {
      const res = await fetch('/api/admin/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, action: 'delete' }) });
      if (res.ok) loadBanned(bannedPage); else alert('Could not delete');
    } catch (e) { alert('Network error'); }
  }

  // ================= শেয়ার্ড ডেটা ক্যাশ (একবার ফেচ করে সব ট্যাবে ব্যবহার) =================
  let statsCache = null;
  async function fetchStats() {
    const res = await fetch('/api/admin/stats');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load stats');
    statsCache = data;
    return data;
  }

  function makeBar(items, valueKey, maxVal, labelFn) {
    return items.map(d => `
      <div style="display:flex;flex-direction:column;align-items:center;flex:1;">
        <div class="bar" style="height:${Math.max(4, Math.round((Number(d[valueKey]) / maxVal) * 100))}%;" title="${d[valueKey]}"></div>
        <div class="bar-label">${labelFn(d)}</div>
      </div>`).join('');
  }

  // ================= Overview ট্যাব — দ্রুত সারসংক্ষেপ + বাকি ট্যাবগুলোতে quick link =================
  async function loadOverview() {
    const c = document.getElementById('overviewContent');
    c.innerHTML = '<div class="empty-state">Loading...</div>';
    try {
      const data = statsCache || await fetchStats();
      const t = data.totals, tok = data.tokenTotals, fb = data.feedbackTotals;
      const satisfaction = (Number(fb.total_up) + Number(fb.total_down)) > 0
        ? Math.round((Number(fb.total_up) / (Number(fb.total_up) + Number(fb.total_down))) * 100)
        : null;

      c.innerHTML = `
        <div class="analytics-grid">
          <div class="analytics-card"><div class="num">${t.total_users}</div><div class="label">Total Users</div></div>
          <div class="analytics-card"><div class="num">${t.new_today}</div><div class="label">New Today</div></div>
          <div class="analytics-card"><div class="num">${tok.total_tokens}</div><div class="label">Total Tokens</div></div>
          <div class="analytics-card"><div class="num">${satisfaction !== null ? satisfaction + '%' : '—'}</div><div class="label">Satisfaction</div></div>
        </div>
        <div class="section-title">দ্রুত দেখুন</div>
        <div class="quick-link-row">
          <div class="quick-link" onclick="switchTab('growth')">📈 Growth</div>
          <div class="quick-link" onclick="switchTab('tokens')">🔢 Tokens</div>
          <div class="quick-link" onclick="switchTab('feedback')">👍 Feedback</div>
          <div class="quick-link" onclick="switchTab('categories')">🏷️ Categories</div>
          <div class="quick-link" onclick="switchTab('banned')">🚫 Banned Users</div>
          <div class="quick-link" onclick="switchTab('audit')">📜 Audit Log</div>
        </div>
      `;
    } catch (e) { c.innerHTML = '<div class="empty-state">Network error</div>'; }
  }

  // ================= Growth ট্যাব — নতুন ইউজার ও লগইন-সোর্স বিস্তারিত =================
  async function loadGrowth() {
    const c = document.getElementById('growthContent');
    c.innerHTML = '<div class="empty-state">Loading...</div>';
    try {
      const data = statsCache || await fetchStats();
      const t = data.totals;

      const maxUsers = Math.max(1, ...data.dailyUsers.map(d => Number(d.count)));
      const userBars = makeBar(data.dailyUsers, 'count', maxUsers, d => new Date(d.day).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}));

      const maxMonthly = Math.max(1, ...data.monthlyUsers.map(d => Number(d.count)));
      const monthlyBars = makeBar(data.monthlyUsers, 'count', maxMonthly, d => new Date(d.month).toLocaleDateString('en-GB',{month:'short',year:'2-digit'}));

      c.innerHTML = `
        <div class="analytics-grid">
          <div class="analytics-card"><div class="num">${t.total_users}</div><div class="label">Total Users</div></div>
          <div class="analytics-card"><div class="num">${t.new_today}</div><div class="label">New Today</div></div>
          <div class="analytics-card" style="cursor:pointer;" onclick="goToUsersFilteredBySource('devonix')"><div class="num">${t.users_via_devonix}</div><div class="label">Via Dev-Onix ›</div></div>
          <div class="analytics-card" style="cursor:pointer;" onclick="goToUsersFilteredBySource('email')"><div class="num">${t.users_via_email}</div><div class="label">Via Email ›</div></div>
        </div>
        <div class="section-title">দৈনিক নতুন ইউজার (গত ৩০ দিন)</div>
        <div class="bar-row">${userBars || '<div class="empty-state">No data</div>'}</div>
        <div class="section-title">মাসিক নতুন ইউজার (গত ১২ মাস)</div>
        <div class="bar-row">${monthlyBars || '<div class="empty-state">No data</div>'}</div>
      `;
    } catch (e) { c.innerHTML = '<div class="empty-state">Network error</div>'; }

  // ================= Tokens ট্যাব — মডেল-ভিত্তিক খরচ ব্রেকডাউন সহ =================
  async function loadTokens() {
    const c = document.getElementById('tokensContent');
    c.innerHTML = '<div class="empty-state">Loading...</div>';
    try {
      const data = statsCache || await fetchStats();
      const tok = data.tokenTotals;

      const maxTokens = Math.max(1, ...data.dailyTokens.map(d => Number(d.count)));
      const tokenBars = makeBar(data.dailyTokens, 'count', maxTokens, d => new Date(d.day).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}));

      const maxMonthlyTok = Math.max(1, ...data.monthlyTokens.map(d => Number(d.count)));
      const monthlyTokenBars = makeBar(data.monthlyTokens, 'count', maxMonthlyTok, d => new Date(d.month).toLocaleDateString('en-GB',{month:'short',year:'2-digit'}));

      const maxModel = Math.max(1, ...data.modelBreakdown.map(m => Number(m.tokens)));
      const modelRows = data.modelBreakdown.map(m => `
        <div class="cat-row">
          <div class="cat-name">${m.model_group} <span style="color:#94a3b8;font-weight:400;">(${m.requests} calls)</span></div>
          <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${Math.round((m.tokens / maxModel) * 100)}%"></div></div>
          <div class="cat-count">${m.tokens}</div>
        </div>`).join('');

      c.innerHTML = `
        <div class="analytics-grid">
          <div class="analytics-card"><div class="num">${tok.total_tokens}</div><div class="label">Total Tokens</div></div>
          <div class="analytics-card"><div class="num">${tok.tokens_today}</div><div class="label">Today's Tokens</div></div>
        </div>
        <div class="section-title">দৈনিক টোকেন ব্যবহার (গত ৩০ দিন)</div>
        <div class="bar-row">${tokenBars || '<div class="empty-state">No data</div>'}</div>
        <div class="section-title">মাসিক টোকেন ব্যবহার (গত ১২ মাস)</div>
        <div class="bar-row">${monthlyTokenBars || '<div class="empty-state">No data</div>'}</div>
        <div class="section-title">মডেল অনুযায়ী খরচ (Groq vs OpenRouter vs Synthesis)</div>
        <div class="cat-list">${modelRows || '<div class="empty-state" style="padding:14px 0;">No data</div>'}</div>
      `;
    } catch (e) { c.innerHTML = '<div class="empty-state">Network error</div>'; }
  }

  // ================= Feedback ট্যাব — satisfaction rate সহ =================
  async function loadFeedback() {
    const c = document.getElementById('feedbackContent');
    c.innerHTML = '<div class="empty-state">Loading...</div>';
    try {
      const data = statsCache || await fetchStats();
      const fb = data.feedbackTotals;
      const totalFb = Number(fb.total_up) + Number(fb.total_down);
      const satisfaction = totalFb > 0 ? Math.round((Number(fb.total_up) / totalFb) * 100) : null;

      const maxFb = Math.max(1, ...data.dailyFeedback.map(d => Math.max(Number(d.up), Number(d.down))));
      const fbBars = data.dailyFeedback.map(d => `
        <div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:1px;">
          <div style="display:flex;align-items:flex-end;gap:1px;height:100px;width:100%;">
            <div class="bar" style="flex:1;height:${Math.max(3, Math.round((d.up / maxFb) * 100))}%;" title="👍 ${d.up}"></div>
            <div class="bar down" style="flex:1;height:${Math.max(3, Math.round((d.down / maxFb) * 100))}%;" title="👎 ${d.down}"></div>
          </div>
          <div class="bar-label">${new Date(d.day).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</div>
        </div>`).join('');

      c.innerHTML = `
        <div class="big-card">
          <div class="satisfaction-badge" style="color:${satisfaction === null ? '#94a3b8' : satisfaction >= 70 ? '#16a34a' : satisfaction >= 40 ? '#d97706' : '#dc2626'};">
            ${satisfaction !== null ? satisfaction + '%' : 'কোনো ডেটা নেই'}
          </div>
          <div class="label">Satisfaction Rate (👍 / মোট ফিডব্যাক)</div>
        </div>
        <div class="analytics-grid">
          <div class="analytics-card"><div class="num">${fb.total_up}</div><div class="label">👍 Total Up</div></div>
          <div class="analytics-card"><div class="num">${fb.total_down}</div><div class="label">👎 Total Down</div></div>
        </div>
        <div class="section-title">গত ৩০ দিনে ফিডব্যাক (নীল=👍 লাল=👎)</div>
        <div class="bar-row">${fbBars || '<div class="empty-state">No data</div>'}</div>
      `;
    } catch (e) { c.innerHTML = '<div class="empty-state">Network error</div>'; }
  }

  // ================= Category-এর ভেতরের entity ব্রেকডাউন (দুই-স্তরের ড্রিলডাউন) =================
  async function openCategoryBreakdown(category) {
    const overlay = document.getElementById('categoryModal');
    const box = document.getElementById('categoryModalContent');
    overlay.classList.add('active');
    box.innerHTML = '<div class="empty-state">Loading...</div>';

    try {
      const res = await fetch('/api/admin/stats?category=' + encodeURIComponent(category));
      const data = await res.json();
      if (!res.ok) { box.innerHTML = '<div class="empty-state">Could not load</div>'; return; }

      if (data.entityBreakdown.length === 0) {
        box.innerHTML = `<div class="empty-state">No specific breakdown available for this category (total ${data.total})</div>`;
        return;
      }

      const maxE = Math.max(1, ...data.entityBreakdown.map(e => Number(e.count)));
      box.innerHTML = data.entityBreakdown.map(e => `
        <div class="cat-row">
          <div class="cat-name">${e.entity}</div>
          <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${Math.round((e.count / maxE) * 100)}%"></div></div>
          <div class="cat-count">${e.count}</div>
        </div>`).join('');
    } catch (e) {
      box.innerHTML = '<div class="empty-state">Network error</div>';
    }
  }

  function closeCategoryModal() {
    document.getElementById('categoryModal').classList.remove('active');
  }

  // ================= Knowledge (RAG) ট্যাব =================
  async function loadKnowledgeSummary() {
    const el = document.getElementById('knowledgeSummary');
    el.innerHTML = '<div class="empty-state">Loading...</div>';
    try {
      const res = await fetch('/api/admin/ingest-knowledge');
      const data = await res.json();
      if (!res.ok) { el.innerHTML = `<div class="empty-state">${data.error || 'Load failed'}</div>`; return; }

      if (data.summary.length === 0) {
        el.innerHTML = '<div class="empty-state">এখনো কোনো জ্ঞান যোগ করা হয়নি</div>';
        return;
      }

      el.innerHTML = `
        <div style="font-size:13px; color:#64748b; margin-bottom:8px;">মোট ${data.total} টি chunk</div>
        ${data.summary.map(s => `
          <div class="cat-row">
            <div class="cat-name">${s.tradition}</div>
            <div class="cat-count">${s.chunk_count}</div>
          </div>
        `).join('')}
      `;
    } catch (e) {
      el.innerHTML = '<div class="empty-state">Network error</div>';
    }
  }

  async function ingestKnowledge() {
    const tradition = document.getElementById('kTradition').value.trim();
    const sourceRef = document.getElementById('kSourceRef').value.trim();
    const text = document.getElementById('kText').value.trim();
    const resultEl = document.getElementById('ingestResult');
    const btn = document.getElementById('ingestBtn');

    if (!tradition || !text) {
      resultEl.innerHTML = '<span style="color:#dc2626;">tradition ও text দুটোই দিতে হবে</span>';
      return;
    }

    btn.disabled = true;
    btn.innerText = '⏳ Chunking + Embedding চলছে... (বড় টেক্সটে কয়েক মিনিট লাগতে পারে)';
    resultEl.innerHTML = '';

    try {
      const res = await fetch('/api/admin/ingest-knowledge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tradition, sourceRef, text })
      });
      const data = await res.json();

      if (!res.ok) {
        resultEl.innerHTML = `<span style="color:#dc2626;">${data.error || 'ব্যর্থ হয়েছে'}</span>`;
      } else {
        resultEl.innerHTML = `<span style="color:#16a34a;">✅ ${data.inserted}/${data.totalChunks} chunk সফলভাবে সেভ হয়েছে${data.failed > 0 ? ` (${data.failed} টি ব্যর্থ)` : ''}</span>`;
        document.getElementById('kText').value = '';
        loadKnowledgeSummary();
      }
    } catch (e) {
      resultEl.innerHTML = '<span style="color:#dc2626;">Network error</span>';
    }

    btn.disabled = false;
    btn.innerText = '⬆️ Chunk করে Embed করে সেভ করুন';
  }
</script>
