<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pravax - Your AI Companion for Any Question">
<title>Pravax</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg-primary: #f9fafb;
  --bg-secondary: #ffffff;
  --border: #e5e7eb;
  --text-primary: #1f2937;
  --text-secondary: #6b7280;
  --accent: #2563eb;
  --accent-light: #dbeafe;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}

.container { display: flex; height: 100vh; flex-direction: row; }

/* ================= SIDEBAR ================= */
.sidebar {
  width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
  @media (max-width: 768px) { display: none; }
}

.sidebar-header {
  padding: 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}

.sidebar-logo { font-size: 24px; font-weight: 700; color: var(--accent); }

.sidebar-content { flex: 1; padding: 12px; }

.new-chat-btn {
  width: 100%; padding: 12px; background: var(--accent); color: white;
  border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
  font-size: 14px; margin-bottom: 12px;
}

/* ================= MAIN CHAT ================= */
.main {
  flex: 1; display: flex; flex-direction: column;
  position: relative;
}

.chat-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: relative; z-index: 10;
}

.header-title { font-size: 16px; font-weight: 600; }

.menu-btn {
  background: none; border: none; font-size: 20px; cursor: pointer;
  padding: 8px; display: none;
  @media (max-width: 768px) { display: block; position: sticky; top: 0; z-index: 20; }
}

.chat-messages {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
}

.message {
  display: flex; gap: 12px; animation: slideIn 0.3s ease-out;
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
}

.message.user { justify-content: flex-end; }
.message.ai { justify-content: flex-start; }

.message-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}

.message.user .message-avatar { background: var(--accent-light); }

.message-bubble {
  max-width: 70%; padding: 12px 16px; border-radius: 12px; word-wrap: break-word;
  line-height: 1.5; font-size: 14px;
}

.message.user .message-bubble {
  background: var(--accent); color: white; border-radius: 16px 4px 16px 16px;
}

.message.ai .message-bubble {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 4px 16px 16px 16px; color: var(--text-primary);
}

/* ================= THINKING ANIMATION (Claude-style) ================= */
.message.thinking .message-avatar {
  position: relative;
}

.thinking-spinner {
  width: 24px; height: 24px; position: relative;
  display: inline-flex; align-items: center; justify-content: center;
}

.thinking-dot {
  width: 8px; height: 8px; border-radius: 50%;
  position: absolute; background: var(--accent);
  animation: dot-pulse 1.4s infinite;
}

.thinking-dot:nth-child(1) {
  animation-delay: 0s;
  left: 2px;
  background: linear-gradient(to bottom, #2563eb, #60a5fa);
}

.thinking-dot:nth-child(2) {
  animation-delay: 0.2s;
  left: 8px;
  background: linear-gradient(to bottom, #60a5fa, #93c5fd);
}

.thinking-dot:nth-child(3) {
  animation-delay: 0.4s;
  left: 14px;
  background: linear-gradient(to bottom, #93c5fd, #bfdbfe);
}

@keyframes dot-pulse {
  0%, 100% { transform: scale(1) translateY(0); opacity: 1; }
  50% { transform: scale(1.2) translateY(-4px); opacity: 0.7; }
}

.thinking-text {
  margin-left: 8px; color: var(--text-secondary); font-size: 13px;
  animation: pulse-text 2s ease-in-out infinite;
}

@keyframes pulse-text {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ================= FEEDBACK BUTTONS ================= */
.feedback-row {
  display: flex; gap: 8px; margin-top: 8px;
}

.fb-btn {
  border: 1.5px solid var(--border); background: var(--bg-secondary);
  border-radius: 8px; width: 28px; height: 28px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all 0.15s; outline: none;
  -webkit-appearance: none; appearance: none;
  -webkit-tap-highlight-color: transparent;
}

.fb-btn:active { transform: scale(0.92); }
.fb-btn.on-up { background: #dcfce7; border-color: #86efac; color: #16a34a; }
.fb-btn.on-down { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }

/* ================= INPUT AREA ================= */
.input-area {
  padding: 16px 20px; border-top: 1px solid var(--border);
  background: var(--bg-primary);
  position: relative; z-index: 5;
}

.input-group {
  display: flex; gap: 8px;
}

.input-field {
  flex: 1; padding: 12px 16px; border: 1.5px solid var(--border);
  border-radius: 12px; font-size: 14px; font-family: inherit;
  outline: none; background: var(--bg-secondary); color: var(--text-primary);
  transition: border-color 0.2s;
}

.input-field:focus {
  border-color: var(--accent); background: white;
}

.input-field::placeholder { color: var(--text-secondary); }

.send-btn {
  width: 40px; height: 40px; border: none; border-radius: 10px;
  background: var(--accent); color: white; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}

.send-btn:hover { background: #1d4ed8; }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.5; }

/* ================= MOBILE RESPONSIVE ================= */
@media (max-width: 768px) {
  .container { flex-direction: column; }
  .message-bubble { max-width: 85%; }
  .chat-header { padding: 12px 12px; }
  .input-area { padding: 12px; }
}

/* ================= LOADING ================= */
.loading-spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Pravax</div>
    </div>
    <div class="sidebar-content"></div>
  </div>

  <!-- ================= MAIN CHAT ================= -->
  <div class="main">
    <div class="chat-header">
      <div class="header-title">Pravax</div>
      <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">☰</button>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="input-area">
      <div class="input-group">
        <input type="text" class="input-field" id="userInput" 
               placeholder="Ask me anything..." autocomplete="off">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
// ================= STATE ================= 
let sessions = [];
let curId = null;
let user = null;

const PAGE_SIZE = 20;
let msgs = [];
let allMsgs = [];
let page = 1;
let total = 0;

// ================= AUTH CHECK ================= 
(async function checkAuth() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) {
      console.warn('Auth check failed');
      window.location.replace('login.html');
      return;
    }
    const { user: u } = await res.json();
    user = u;

    // Dev-Onix একাউন্ট মনে রাখা (login.html এর account chooser এর জন্য)
    if (user.login_source === 'devonix' && user.email) {
      try {
        const KEY = 'dl_known_devonix_accounts';
        let accounts = JSON.parse(localStorage.getItem(KEY) || '[]');
        accounts = accounts.filter(a => a.email !== user.email);
        accounts.unshift({
          email: user.email,
          name: `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.email,
          avatar: user.profile_picture || ''
        });
        localStorage.setItem(KEY, JSON.stringify(accounts.slice(0, 5)));
      } catch (e) {}
    }

    newChat();
  } catch (e) {
    console.error(e);
    window.location.replace('login.html');
  }
})();

// ================= CHAT FUNCTIONS ================= 
function newChat() {
  curId = 'local_' + Date.now();
  sessions.push({ id: curId, title: 'New Chat', messages: [] });
  msgs = [];
  allMsgs = [];
  page = 1;
  total = 0;
  renderChat();
}

async function sendMessage() {
  const inp = document.getElementById('userInput');
  const text = inp.value.trim();

  if (!text || !user) return;

  inp.value = '';
  inp.focus();

  // ইউজার মেসেজ যোগ করা
  msgs.push({ role: 'user', content: text });
  renderChat();

  // AI thinking indicator দেখানো
  showThinkingIndicator();

  try {
    const res = await fetch('/api/interpret', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        dream: text,
        sessionId: curId.startsWith('local_') ? null : curId
      })
    });

    if (!res.ok) {
      const err = await res.json();
      msgs.push({ role: 'ai', content: `Error: ${err.error || 'Unknown error'}` });
      renderChat();
      return;
    }

    const data = await res.json();
    msgs.push({ role: 'ai', content: data.text });

    if (data.sessionId && curId.startsWith('local_')) {
      curId = data.sessionId;
      if (sessions[0].id.startsWith('local_')) {
        sessions[0].id = curId;
      }
    }

    renderChat();
  } catch (e) {
    console.error(e);
    msgs.push({ role: 'ai', content: 'Network error. Please try again.' });
    renderChat();
  }
}

function showThinkingIndicator() {
  const chatEl = document.getElementById('chatMessages');
  const msgEl = document.createElement('div');
  msgEl.className = 'message ai thinking';
  msgEl.id = 'thinkingMsg';
  msgEl.innerHTML = `
    <div class="message-avatar">
      <div class="thinking-spinner">
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
      </div>
    </div>
    <div class="message-bubble">
      <span class="thinking-text">Thinking...</span>
    </div>
  `;
  chatEl.appendChild(msgEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderChat() {
  const chatEl = document.getElementById('chatMessages');
  const thinkingMsg = document.getElementById('thinkingMsg');
  if (thinkingMsg) thinkingMsg.remove();

  chatEl.innerHTML = msgs.map((m, i) => {
    const isUser = m.role === 'user';
    return `
      <div class="message ${isUser ? 'user' : 'ai'}">
        <div class="message-avatar">${isUser ? '👤' : '🧠'}</div>
        <div>
          <div class="message-bubble">${escapeHtml(m.content)}</div>
          ${!isUser && i === msgs.length - 1 ? `
            <div class="feedback-row">
              <button class="fb-btn" onclick="feedback(${i}, 'up')" id="fb-up-${i}">👍</button>
              <button class="fb-btn" onclick="feedback(${i}, 'down')" id="fb-down-${i}">👎</button>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');

  chatEl.scrollTop = chatEl.scrollHeight;
}

async function feedback(msgIdx, type) {
  const msg = msgs[msgIdx];
  if (msg.role !== 'ai') return;

  const btnId = `fb-${type}-${msgIdx}`;
  const btn = document.getElementById(btnId);
  if (!btn) return;

  const opposite = type === 'up' ? 'down' : 'up';
  const oppBtn = document.getElementById(`fb-${opposite}-${msgIdx}`);

  btn.classList.toggle(`on-${type}`);
  if (oppBtn) oppBtn.classList.remove(`on-${opposite}`);

  try {
    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messageId: curId, feedback: btn.classList.contains(`on-${type}`) ? type : null })
    });
  } catch (e) {
    console.error(e);
  }
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function toggleSidebar() {
  // Mobile এ sidebar toggle করার জন্য (এখনকার জন্য শুধু placeholder)
}

// ================= KEYBOARD EVENTS ================= 
document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
