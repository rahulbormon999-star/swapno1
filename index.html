<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Pravax - Your AI Companion for Any Question">
<title>Pravax</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

:root {
  --bg-primary: #f9fafb;
  --bg-secondary: #ffffff;
  --border: #e5e7eb;
  --text-primary: #1f2937;
  --text-secondary: #6b7280;
  --accent: #2563eb;
  --accent-light: #dbeafe;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
}

.container {
  display: flex;
  height: 100vh;
  height: 100dvh; /* মোবাইল ব্রাউজারে ঠিকানা-বার সহ সঠিক উচ্চতার জন্য */
}

/* ================= SIDEBAR ================= */
.sidebar {
  width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
  transition: transform 0.25s ease;
}

.sidebar-header {
  padding: 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}

.sidebar-logo-icon { width: 26px; height: 26px; flex-shrink: 0; }
.sidebar-logo { font-size: 20px; font-weight: 700; color: var(--accent); }

.sidebar-content { flex: 1; padding: 12px; }

.new-chat-btn {
  width: 100%; padding: 12px; background: var(--accent); color: white;
  border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
  font-size: 14px; margin-bottom: 12px;
}

.sidebar-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40;
}

/* ================= MAIN CHAT ================= */
.main {
  flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%;
}

.chat-header {
  flex-shrink: 0;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}

.menu-btn {
  background: none; border: none; font-size: 20px; cursor: pointer;
  padding: 6px 8px; display: none; color: var(--text-primary);
  -webkit-tap-highlight-color: transparent; outline: none;
}

.header-title { font-size: 16px; font-weight: 700; }

/* ================= CHAT MESSAGES ================= */
.chat-messages {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 20px; display: flex; flex-direction: column; gap: 18px;
}

.message { display: flex; animation: slideIn 0.3s ease-out; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.message.user { justify-content: flex-end; }
.message.ai { justify-content: flex-start; }

.message-bubble {
  max-width: 80%; padding: 12px 16px; border-radius: 14px; word-wrap: break-word;
  line-height: 1.6; font-size: 14.5px; white-space: pre-wrap;
}

.message.user .message-bubble { background: var(--accent); color: white; border-radius: 16px 4px 16px 16px; }
.message.ai .message-bubble { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; color: var(--text-primary); }

/* ================= THINKING (Pravax লোগো অ্যানিমেশন + শিমার টেক্সট) ================= */
.thinking-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }

.thinking-logo-box {
  width: 30px; height: 30px; position: relative; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}

.thinking-logo-svg {
  width: 30px; height: 30px;
}

.thinking-logo-rotate {
  transform-origin: 50px 50px;
  animation: continuousRotate 3s infinite linear;
}

.thinking-logo-content {
  transform-origin: 50px 50px;
  animation: subtleBreathe 1.4s infinite ease-in-out alternate;
}

@keyframes continuousRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes subtleBreathe { 0% { transform: scale(0.85); } 100% { transform: scale(1.15); } }

.thinking-bold-path { fill: none; stroke: url(#pravax-gradient); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
.thinking-inner-path { fill: none; stroke: var(--bg-primary); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

.stop-blue { animation: colorShiftBlue 1.6s infinite ease-in-out alternate; }
.stop-sky { animation: colorShiftSky 1.6s infinite ease-in-out alternate; }
@keyframes colorShiftBlue { 0% { stop-color: #1d4ed8; } 50% { stop-color: #0284c7; } 100% { stop-color: #1d4ed8; } }
@keyframes colorShiftSky { 0% { stop-color: #38bdf8; } 50% { stop-color: #818cf8; } 100% { stop-color: #38bdf8; } }

.thinking-text {
  font-size: 14px; font-weight: 600;
  background: linear-gradient(90deg, #9ca3af 0%, #2563eb 45%, #38bdf8 55%, #9ca3af 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmer 1.8s linear infinite;
}
@keyframes shimmer { 0% { background-position: 250% 0; } 100% { background-position: -250% 0; } }

/* ================= FEEDBACK BUTTONS ================= */
.feedback-row { display: flex; gap: 8px; margin-top: 8px; }

.fb-btn {
  border: 1.5px solid var(--border); background: var(--bg-secondary);
  border-radius: 8px; width: 28px; height: 28px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: transform .15s, background .15s; outline: none;
  -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent;
}
.fb-btn:active { transform: scale(0.92); }
.fb-btn.on-up { background: #dcfce7; border-color: #86efac; color: #16a34a; }
.fb-btn.on-down { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }

/* ================= INPUT AREA ================= */
.input-area {
  flex-shrink: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom)) 16px;
  border-top: 1px solid var(--border);
  background: var(--bg-primary);
}

.input-group { display: flex; gap: 8px; }

.input-field {
  flex: 1; padding: 12px 16px; border: 1.5px solid var(--border);
  border-radius: 12px; font-size: 15px; font-family: inherit;
  outline: none; background: var(--bg-secondary); color: var(--text-primary);
  transition: border-color 0.2s;
}
.input-field:focus { border-color: var(--accent); background: white; }
.input-field::placeholder { color: var(--text-secondary); }

.send-btn {
  width: 42px; height: 42px; border: none; border-radius: 10px; flex-shrink: 0;
  background: var(--accent); color: white; font-size: 17px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.6; }

/* ================= MOBILE ================= */
@media (max-width: 768px) {
  .menu-btn { display: block; }
  .sidebar {
    position: fixed; top: 0; left: 0; height: 100%; height: 100dvh; z-index: 50;
    transform: translateX(-100%); box-shadow: 0 0 30px rgba(0,0,0,0.15);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.show { display: block; }
  .message-bubble { max-width: 88%; }
}
</style>
</head>
<body>

<div class="container">
  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <svg class="sidebar-logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sidebar-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1d4ed8" />
            <stop offset="100%" stop-color="#38bdf8" />
          </linearGradient>
        </defs>
        <g>
          <path fill="none" stroke="url(#sidebar-gradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(0 50 50)" />
          <path fill="none" stroke="url(#sidebar-gradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(120 50 50)" />
          <path fill="none" stroke="url(#sidebar-gradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(240 50 50)" />
          <path fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(0 50 50)" />
          <path fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(120 50 50)" />
          <path fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(240 50 50)" />
        </g>
      </svg>
      <div class="sidebar-logo">Pravax</div>
    </div>
    <div class="sidebar-content">
      <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- ================= MAIN CHAT ================= -->
  <div class="main">
    <div class="chat-header">
      <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">☰</button>
      <div class="header-title">Pravax</div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="input-area">
      <div class="input-group">
        <input type="text" class="input-field" id="userInput"
               placeholder="Message Pravax..." autocomplete="off">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
// ================= STATE =================
let sessions = [];
let curId = null;
let user = null;
let msgs = [];

// ================= SIDEBAR TOGGLE (মোবাইল ড্রয়ার) =================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

// ================= AUTH CHECK =================
(async function checkAuth() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) {
      console.warn('Auth check failed');
      window.location.replace('login.html');
      return;
    }
    const { user: u } = await res.json();
    user = u;

    if (user.login_source === 'devonix' && user.email) {
      try {
        const KEY = 'dl_known_devonix_accounts';
        let accounts = JSON.parse(localStorage.getItem(KEY) || '[]');
        accounts = accounts.filter(a => a.email !== user.email);
        accounts.unshift({
          email: user.email,
          name: `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.email,
          avatar: user.profile_picture || ''
        });
        localStorage.setItem(KEY, JSON.stringify(accounts.slice(0, 5)));
      } catch (e) {}
    }

    newChat();
  } catch (e) {
    console.error(e);
    window.location.replace('login.html');
  }
})();

// ================= CHAT FUNCTIONS =================
function newChat() {
  curId = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  msgs = [];
  renderChat();
  if (window.innerWidth <= 768) toggleSidebarClose();
}

function toggleSidebarClose() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

async function sendMessage() {
  const inp = document.getElementById('userInput');
  const text = inp.value.trim();
  if (!text || !user) return;

  inp.value = '';
  inp.focus();

  msgs.push({ role: 'user', content: text });
  renderChat();
  showThinkingIndicator();

  try {
    const res = await fetch('/api/interpret', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        dream: text,
        history: msgs.slice(0, -1).map(m => ({ role: m.role, text: m.content })),
        sessionId: curId.startsWith('local_') ? null : curId
      })
    });

    if (!res.ok) {
      const err = await res.json();
      msgs.push({ role: 'ai', content: `Error: ${err.error || 'Unknown error'}` });
      renderChat();
      return;
    }

    const data = await res.json();
    msgs.push({ role: 'ai', content: data.text, messageId: data.messageId });

    if (data.sessionId && curId.startsWith('local_')) {
      curId = data.sessionId;
    }

    renderChat();
  } catch (e) {
    console.error(e);
    msgs.push({ role: 'ai', content: 'Network error. Please try again.' });
    renderChat();
  }
}

// ================= Pravax লোগো (থিংকিং ইন্ডিকেটরের জন্য) =================
const THINKING_LOGO_SVG = `
<svg class="thinking-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pravax-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop class="stop-blue" offset="0%" stop-color="#1d4ed8" />
      <stop class="stop-sky" offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <g class="thinking-logo-rotate">
    <g class="thinking-logo-content">
      <path class="thinking-bold-path" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(0 50 50)" />
      <path class="thinking-bold-path" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(120 50 50)" />
      <path class="thinking-bold-path" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(240 50 50)" />
      <path class="thinking-inner-path" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(0 50 50)" />
      <path class="thinking-inner-path" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(120 50 50)" />
      <path class="thinking-inner-path" d="M 50,22 C 58,35 58,45 50,55 C 42,45 42,35 50,22 Z" transform="rotate(240 50 50)" />
    </g>
  </g>
</svg>`;

function showThinkingIndicator() {
  const chatEl = document.getElementById('chatMessages');
  const msgEl = document.createElement('div');
  msgEl.className = 'message ai';
  msgEl.id = 'thinkingMsg';
  msgEl.innerHTML = `
    <div class="thinking-row">
      <div class="thinking-logo-box">${THINKING_LOGO_SVG}</div>
      <span class="thinking-text">Thinking...</span>
    </div>
  `;
  chatEl.appendChild(msgEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderChat() {
  const chatEl = document.getElementById('chatMessages');
  const thinkingMsg = document.getElementById('thinkingMsg');
  if (thinkingMsg) thinkingMsg.remove();

  chatEl.innerHTML = msgs.map((m, i) => {
    const isUser = m.role === 'user';
    return `
      <div class="message ${isUser ? 'user' : 'ai'}">
        <div>
          <div class="message-bubble">${escapeHtml(m.content)}</div>
          ${!isUser && i === msgs.length - 1 ? `
            <div class="feedback-row">
              <button class="fb-btn" onclick="feedback(${i}, 'up')" id="fb-up-${i}">👍</button>
              <button class="fb-btn" onclick="feedback(${i}, 'down')" id="fb-down-${i}">👎</button>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');

  chatEl.scrollTop = chatEl.scrollHeight;
}

async function feedback(msgIdx, type) {
  const msg = msgs[msgIdx];
  if (!msg || msg.role !== 'ai' || !msg.messageId) return;

  const btn = document.getElementById(`fb-${type}-${msgIdx}`);
  const oppBtn = document.getElementById(`fb-${type === 'up' ? 'down' : 'up'}-${msgIdx}`);
  if (!btn) return;

  const nowActive = !btn.classList.contains(`on-${type}`);
  btn.classList.toggle(`on-${type}`, nowActive);
  if (oppBtn) oppBtn.classList.remove(`on-${type === 'up' ? 'down' : 'up'}`);

  try {
    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messageId: msg.messageId, feedback: nowActive ? type : null })
    });
  } catch (e) { console.error(e); }
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
          </html>
